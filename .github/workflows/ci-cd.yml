name: MedCore HMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install client dependencies
        run: cd client && npm ci
      - name: Run lint
        run: npm run lint

  build-client:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: cd client && npm ci
      - name: Build client
        run: cd client && npm run build

  server-smoke:
    name: Backend Smoke Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: cd server && npm ci
      - name: Seed database
        run: cd server && MONGODB_URI=mongodb://127.0.0.1:27017/medcore_ci npm run seed
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
      - name: Start server and verify health endpoint
        run: |
          cd server
          MONGODB_URI=mongodb://127.0.0.1:27017/medcore_ci \
          JWT_SECRET=ci-test-secret \
          JWT_REFRESH_SECRET=ci-test-refresh-secret \
          node server.js &
          sleep 6
          curl --fail -s http://localhost:5000/api/health
          kill %1